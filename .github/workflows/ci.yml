name: CI

on:
  push:
    branches-ignore: [prototype/*]  # experimental, no gating needed
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Branch naming convention
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          # Protected branches use their own convention — skip check
          case "$BRANCH" in
            main|dev|staging|prototype/*) exit 0 ;;
          esac
          if ! echo "$BRANCH" | grep -qE '^(feat|fix|chore|docs|refactor)/[0-9]+-[a-z0-9.-]+$'; then
            echo "::error::Branch name '$BRANCH' does not match convention."
            echo "   Expected: ^(feat|fix|chore|docs|refactor)/<issue-number>-<kebab-description>"
            echo "   Example:  feat/42-add-hero-block"
            exit 1
          fi

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Lint
        run: pnpm lint

      - name: TypeScript check
        run: pnpm typecheck

      - name: Tests (unit + storybook)
        run: pnpm test:run

      - name: Build
        run: pnpm build
